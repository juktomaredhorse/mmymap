
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내 결혼 상대 결정하기 💗</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Malgun Gothic",sans-serif;color:#39253f;background:#fff7fc}
.app{display:flex;height:100vh;min-height:600px}
.sidebar{width:410px;flex-shrink:0;background:white;display:flex;flex-direction:column;box-shadow:5px 0 25px #60345b12;z-index:2}
.hero{padding:27px 24px;background:linear-gradient(135deg,#ffd6e9,#e9dcff)}
.pill{display:inline-block;background:#ffffffbb;color:#bd2679;padding:7px 12px;border-radius:30px;font-size:11px;font-weight:bold;letter-spacing:1px}
h1{font-size:29px;line-height:1.35;margin:16px 0 8px;letter-spacing:-1px}
.hero p{font-size:13px;color:#765e80;line-height:1.7;margin:0}
.content{padding:20px;overflow:auto;flex:1}
.tabs{display:flex;gap:8px;padding:5px;border-radius:14px;background:#f8eff9;margin-bottom:20px}
.tab{flex:1;padding:13px 5px;border:0;border-radius:10px;background:transparent;color:#8d7a93;font-weight:bold;cursor:pointer}
.tab.active{background:linear-gradient(120deg,#ec4899,#a855f7);color:white;box-shadow:0 5px 12px #dc55aa30}
.label{font-size:13px;font-weight:bold;margin-bottom:9px}
.searchrow{display:flex;gap:8px}
input{width:100%;min-width:0;padding:0 12px;height:48px;border:1px solid #eadbea;border-radius:12px;outline:none;font-size:14px}
input:focus{border-color:#e879b2;box-shadow:0 0 0 3px #fce7f3}
button{font-family:inherit}
.searchbtn{width:70px;flex-shrink:0;border:0;border-radius:12px;background:linear-gradient(120deg,#ec4899,#c026d3);color:white;font-weight:bold;cursor:pointer}
.nearbtn{width:100%;padding:14px;margin-top:10px;border:1px solid #efc5df;border-radius:12px;background:#fff0f8;color:#be287d;font-weight:bold;cursor:pointer}
.hint{font-size:12px;line-height:1.7;color:#8c7b91;margin:13px 0 18px}
.resulthead{display:flex;justify-content:space-between;border-top:1px solid #f0e5f1;padding-top:17px;margin-bottom:12px;font-size:14px;font-weight:bold}
#count{color:#d9469b;font-size:12px}
#status{font-size:13px;line-height:1.7;color:#806b87;background:#fcf5fc;border-radius:10px;padding:12px;margin-bottom:10px}
#results{display:flex;flex-direction:column;gap:9px}
.card{padding:14px;border:1px solid #f0e4ef;border-radius:14px;cursor:pointer}
.card:hover{border-color:#e9a5ce;box-shadow:0 5px 15px #87408512}
.tag{font-size:11px;color:#c02675;background:#fff0f7;border-radius:6px;padding:5px 8px;display:inline-block;margin-bottom:7px}
.card h3{font-size:14px;margin:0 0 7px;line-height:1.5}
.card p{font-size:12px;color:#897c90;margin:0;line-height:1.7;overflow-wrap:anywhere}
.maparea{flex:1;min-width:0;position:relative;background:#f7f0f8}
#map{width:100%;height:100%}
.mapbadge{position:absolute;z-index:1;top:18px;left:18px;background:#ffffffed;padding:12px 15px;border-radius:13px;box-shadow:0 5px 20px #3c1e4615;font-size:13px;font-weight:bold;pointer-events:none}
.mapbadge span{color:#db2777}
#mapmessage{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(85%,330px);background:#ffffffed;padding:22px;border:1px solid #f2dfef;border-radius:17px;text-align:center;font-size:13px;line-height:1.8;color:#786981}
#mapmessage strong{display:block;color:#c02675;font-size:16px;margin-bottom:8px}
#mapmessage.hidden{display:none}
@media(max-width:760px){
.app{height:auto;min-height:100vh;flex-direction:column}
.sidebar{width:100%}
.content{overflow:visible}
.maparea{height:50vh;min-height:350px;flex:none}
#map{min-height:350px}
h1{font-size:26px}
}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
<header class="hero">
<div class="pill">LOVE FINDER · LOCATION</div>
<h1>내 결혼 상대<br>결정하기 💍</h1>
<p>나에게 맞는 업체를 찾아보세요.<br>지도에서 위치까지 한눈에 확인해요.</p>
</header>
<main class="content">
<div class="tabs">
<button class="tab active" id="generalTab">💗 결혼정보회사</button>
<button class="tab" id="remarriageTab">💜 재혼 전문 업체</button>
</div>
<div class="label">업체명 또는 지역 검색</div>
<div class="searchrow">
<input id="searchInput" placeholder="예: 서울, 일산, 업체명">
<button class="searchbtn" id="searchBtn">검색</button>
</div>
<button class="nearbtn" id="nearBtn">📍 내 주변 업체 찾기</button>
<p class="hint" id="hint">지역이나 업체명을 입력해 검색하세요.</p>
<div class="resulthead"><span>🔎 검색 결과</span><span id="count">0개</span></div>
<div id="status">카카오맵을 불러오는 중입니다.</div>
<div id="results"></div>
</main>
</aside>
<section class="maparea">
<div class="mapbadge">💗 <span>LOVE MAP</span> · 업체 위치</div>
<div id="map"></div>
<div id="mapmessage"><strong>지도를 준비하고 있어요 💗</strong>카카오맵 연결을 확인하고 있습니다.</div>
</section>
</div>

<script>
const KAKAO_APP_KEY="f38811e47209589c76ef3002c7c95204";

/*
  재혼 업체는 이 목록에 직접 추가합니다.
  주소는 업체의 공식 홈페이지 등에서 확인한 주소를 입력하세요.
  업체 정보가 확인되지 않은 항목은 임의로 추가하지 마세요.
*/
const remarriageCompanies=[
  {
    name:"르매리",
    address:"",
    website:"https://www.lemarry.co.kr/",
    note:"재혼 전문 업체 · 주소 확인 후 지도 표시"
  }
];

let map,places,geocoder,markers=[],infoWindow;
let currentTab="general";
let searchCenter=null;
const $=id=>document.getElementById(id);

function status(text){$("status").textContent=text}
function mapMessage(title,text){
  const box=$("mapmessage");
  box.replaceChildren();
  const strong=document.createElement("strong");
  strong.textContent=title;
  const detail=document.createElement("div");
  detail.textContent=text;
  box.append(strong,detail);
  box.classList.remove("hidden");
}
function hideMapMessage(){$("mapmessage").classList.add("hidden")}

function clearResults(){
  markers.forEach(m=>m.setMap(null));
  markers=[];
  $("results").replaceChildren();
  $("count").textContent="0개";
  if(infoWindow)infoWindow.close();
}
function initMap(){
  try{
    map=new kakao.maps.Map($("map"),{
      center:new kakao.maps.LatLng(37.5665,126.9780),
      level:7
    });
    places=new kakao.maps.services.Places();
    geocoder=new kakao.maps.services.Geocoder();
    infoWindow=new kakao.maps.InfoWindow({zIndex:3});
    hideMapMessage();
    status("지역이나 업체명을 검색해 보세요.");
  }catch(e){
    console.error(e);
    status("지도 초기화에 실패했습니다.");
    mapMessage("지도 연결 실패","카카오 개발자 설정과 JavaScript 키를 확인해 주세요.");
  }
}
function loadMap(){
  const script=document.createElement("script");
  script.src="https://dapi.kakao.com/v2/maps/sdk.js?appkey="+
    encodeURIComponent(KAKAO_APP_KEY)+"&libraries=services&autoload=false";
  script.onload=()=>{
    if(!window.kakao||!kakao.maps){
      status("카카오맵 SDK를 찾을 수 없습니다.");
      mapMessage("지도 연결 실패","JavaScript 키와 등록된 도메인을 확인해 주세요.");
      return;
    }
    kakao.maps.load(initMap);
    setTimeout(()=>{
      if(!map){
        status("지도 준비가 지연되고 있습니다.");
        mapMessage("지도가 표시되지 않아요","카카오 개발자 설정의 도메인과 JavaScript 키를 확인해 주세요.");
      }
    },10000);
  };
  script.onerror=()=>{
    status("카카오맵 SDK를 불러오지 못했습니다.");
    mapMessage("지도 연결 실패","인터넷 연결, JavaScript 키, 사이트 도메인을 확인해 주세요.");
  };
  document.head.appendChild(script);
}

function setTab(tab){
  currentTab=tab;
  $("generalTab").classList.toggle("active",tab==="general");
  $("remarriageTab").classList.toggle("active",tab==="remarriage");
  $("searchInput").value="";
  clearResults();
  searchCenter=null;
  $("hint").textContent=tab==="general"
    ?"카카오맵에서 결혼정보회사 관련 장소를 검색합니다."
    :"직접 등록한 재혼 전문 업체를 검색합니다. 주소가 확인된 업체만 지도에 표시됩니다.";
  status(tab==="general"?"검색어를 입력해 주세요.":"등록된 재혼 전문 업체 목록을 확인합니다.");
  if(tab==="remarriage")searchRemarriage("");
}

function addMarker(place,onClick){
  const pos=new kakao.maps.LatLng(Number(place.y),Number(place.x));
  const marker=new kakao.maps.Marker({map,position:pos});
  markers.push(marker);
  kakao.maps.event.addListener(marker,"click",onClick);
  return marker;
}
function showInfo(place,marker){
  const content=document.createElement("div");
  content.style.cssText="padding:12px;max-width:230px;font-size:12px;line-height:1.7";
  const name=document.createElement("strong");
  name.textContent=place.place_name||place.name;
  name.style.color="#c02675";
  const address=document.createElement("div");
  address.textContent=place.road_address_name||place.address_name||place.address||"주소 정보 없음";
  content.append(name,address);
  if(place.website){
    const link=document.createElement("a");
    link.href=place.website;
    link.target="_blank";
    link.rel="noopener noreferrer";
    link.textContent="공식 홈페이지";
    link.style.display="block";
    content.append(link);
  }
  infoWindow.setContent(content);
  infoWindow.open(map,marker);
  map.panTo(marker.getPosition());
}
function addCard(place,marker,tag){
  const card=document.createElement("article");
  card.className="card";
  const badge=document.createElement("span");
  badge.className="tag";
  badge.textContent=tag;
  const title=document.createElement("h3");
  title.textContent=place.place_name||place.name;
  const address=document.createElement("p");
  address.textContent="📍 "+(place.road_address_name||place.address_name||place.address||"주소 미등록");
  card.append(badge,title,address);
  if(place.phone){
    const phone=document.createElement("p");
    phone.textContent="☎ "+place.phone;
    card.append(phone);
  }
  if(place.website){
    const link=document.createElement("a");
    link.href=place.website;
    link.target="_blank";
    link.rel="noopener noreferrer";
    link.textContent="공식 홈페이지 ↗";
    link.style.cssText="display:inline-block;margin-top:8px;color:#c02675;font-size:12px";
    link.addEventListener("click",e=>e.stopPropagation());
    card.append(link);
  }
  card.addEventListener("click",()=>{
    map.setCenter(marker.getPosition());
    map.setLevel(3);
    showInfo(place,marker);
  });
  $("results").append(card);
}

function searchGeneral(query,center){
  if(!places||!map){status("지도가 아직 준비되지 않았습니다.");return}
  clearResults();
  status("결혼정보회사 관련 장소를 검색하고 있습니다…");
  const terms=query.trim()
    ? (/(결혼정보|결혼상담|중매|결혼중개)/.test(query)
        ?[query]:[query+" 결혼정보회사",query+" 결혼정보"])
    :["결혼정보회사"];
  const found=new Map();
  let finished=0;
  terms.forEach(term=>{
    const options={size:15};
    if(center){
      options.location=center;
      options.sort=kakao.maps.services.SortBy.DISTANCE;
    }
    places.keywordSearch(term,(data,resultStatus)=>{
      if(resultStatus===kakao.maps.services.Status.OK){
        data.forEach(p=>{
          if(/결혼정보|결혼상담|중매|결혼중개/.test(
            (p.place_name||"")+" "+(p.category_name||"")
          ))found.set(p.id,p);
        });
      }
      finished++;
      if(finished===terms.length){
        const list=[...found.values()];
        if(center){
          list.sort((a,b)=>distance(center,a)-distance(center,b));
        }
        if(!list.length){
          status("관련 업체를 찾지 못했습니다. 다른 지역이나 검색어를 시도해 보세요.");
          return;
        }
        showPlaces(list,"💗 결혼정보회사 검색");
      }
    },options);
  });
}

function distance(center,place){
  const p=new kakao.maps.LatLng(Number(place.y),Number(place.x));
  const lat=p.getLat()-center.getLat();
  const lng=p.getLng()-center.getLng();
  return lat*lat+lng*lng;
}

function searchRemarriage(query,center){
  if(!map||!geocoder){status("지도가 아직 준비되지 않았습니다.");return}
  clearResults();
  let list=remarriageCompanies.filter(c=>{
    const text=(c.name+" "+c.address+" "+c.note).toLowerCase();
    return !query.trim()||text.includes(query.trim().toLowerCase());
  });
  if(!list.length){
    status("등록된 업체가 없습니다. 검색어를 지우거나 코드의 업체 목록에 정보를 추가해 주세요.");
    return;
  }
  status("직접 등록한 재혼 업체 정보를 확인하고 있습니다…");
  let finished=0;
  const located=[];
  let missing=0;
  list.forEach(company=>{
    if(!company.address.trim()){
      missing++;
      finished++;
      finish();
      return;
    }
    geocoder.addressSearch(company.address,(data,resultStatus)=>{
      if(resultStatus===kakao.maps.services.Status.OK&&data.length){
        located.push({
          name:company.name,
          address:company.address,
          website:company.website,
          note:company.note,
          x:data[0].x,
          y:data[0].y
        });
      }else missing++;
      finished++;
      finish();
    });
  });
  function finish(){
    if(finished!==list.length)return;
    if(center)located.sort((a,b)=>distance(center,a)-distance(center,b));
    if(located.length)showPlaces(located,"💜 직접 등록한 재혼 업체");
    else status("지도에 표시할 주소가 아직 등록되지 않았습니다. 업체 목록에 정확한 주소를 입력해 주세요.");
    if(missing&&located.length){
      status("주소가 확인된 업체 "+located.length+"개를 표시했습니다. 주소 미등록·확인 불가 업체 "+missing+"개는 지도에서 제외했습니다.");
    }
  }
}

function showPlaces(list,tag){
  const bounds=new kakao.maps.LatLngBounds();
  list.forEach(place=>{
    const marker=addMarker(place,()=>showInfo(place,marker));
    bounds.extend(marker.getPosition());
    addCard(place,marker,tag);
  });
  $("count").textContent=list.length+"개";
  status(list.length+"개 업체를 표시했습니다.");
  if(list.length===1){
    map.setCenter(bounds.getSouthWest());
    map.setLevel(4);
  }else map.setBounds(bounds);
}

function runSearch(){
  const query=$("searchInput").value.trim();
  searchCenter=null;
  if(currentTab==="general")searchGeneral(query,null);
  else searchRemarriage(query,null);
}

function findNearby(){
  if(!map){status("지도가 아직 준비되지 않았습니다.");return}
  if(!navigator.geolocation){
    status("이 브라우저에서는 위치 기능을 사용할 수 없습니다.");
    return;
  }
  $("nearBtn").disabled=true;
  $("nearBtn").textContent="📍 현재 위치 확인 중…";
  navigator.geolocation.getCurrentPosition(pos=>{
    const center=new kakao.maps.LatLng(pos.coords.latitude,pos.coords.longitude);
    searchCenter=center;
    map.setCenter(center);
    map.setLevel(6);
    $("nearBtn").disabled=false;
    $("nearBtn").textContent="📍 내 주변 업체 찾기";
    if(currentTab==="general")searchGeneral($("searchInput").value.trim(),center);
    else searchRemarriage($("searchInput").value.trim(),center);
  },err=>{
    $("nearBtn").disabled=false;
    $("nearBtn").textContent="📍 내 주변 업체 찾기";
    status(err.code===1
      ?"위치 권한이 거부되었습니다. 브라우저에서 위치 권한을 허용해 주세요."
      :"현재 위치를 확인하지 못했습니다. 다시 시도해 주세요.");
  },{enableHighAccuracy:true,timeout:10000,maximumAge:60000});
}

$("generalTab").addEventListener("click",()=>setTab("general"));
$("remarriageTab").addEventListener("click",()=>setTab("remarriage"));
$("searchBtn").addEventListener("click",runSearch);
$("searchInput").addEventListener("keydown",e=>{if(e.key==="Enter")runSearch()});
$("nearBtn").addEventListener("click",findNearby);

loadMap();
</script>
</body>
</html>
