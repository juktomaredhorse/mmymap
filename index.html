
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내 결혼 상대 결정하기 💗</title>

<style>
:root {
  --pink: #e94f86;
  --dark-pink: #c73570;
  --light-pink: #fff0f6;
  --border: #f2cbdc;
  --text: #392b36;
  --muted: #887985;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, "Malgun Gothic", sans-serif;
  color: var(--text);
  background: linear-gradient(135deg, #fff0f6, #fff9fc);
}

.container {
  display: flex;
  height: 100vh;
  padding: 16px;
  gap: 16px;
}

.sidebar {
  width: 390px;
  min-width: 330px;
  display: flex;
  flex-direction: column;
  background: white;
  border: 1px solid var(--border);
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 5px 20px #d85b8712;
}

.header { padding: 22px 20px 14px; }

h1 {
  font-size: 23px;
  margin: 0 0 9px;
  color: var(--dark-pink);
}

.description {
  font-size: 13px;
  color: var(--muted);
  line-height: 1.6;
  margin: 0;
}

.controls { padding: 0 16px 12px; }

.tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}

.tab {
  flex: 1;
  padding: 12px 5px;
  border: 1px solid var(--border);
  border-radius: 11px;
  background: white;
  color: #76566a;
  font-weight: bold;
  cursor: pointer;
}

.tab.active {
  background: var(--pink);
  border-color: var(--pink);
  color: white;
}

#searchInput {
  width: 100%;
  padding: 14px;
  border: 1px solid var(--border);
  border-radius: 11px;
  font-size: 14px;
  outline: none;
  background: #fffafd;
}

#searchInput:focus {
  border-color: var(--pink);
}

#searchButton, #locationButton {
  width: 100%;
  margin-top: 9px;
  padding: 13px;
  border-radius: 11px;
  cursor: pointer;
  font-size: 14px;
}

#searchButton {
  border: 0;
  background: var(--pink);
  color: white;
  font-weight: bold;
}

#searchButton:hover { background: var(--dark-pink); }

#locationButton {
  background: white;
  border: 1px solid var(--border);
  color: #76566a;
}

button:disabled {
  opacity: .6;
  cursor: wait;
}

#status {
  margin: 7px 16px 12px;
  padding: 12px;
  border-radius: 11px;
  background: var(--light-pink);
  color: var(--dark-pink);
  font-size: 13px;
  line-height: 1.5;
}

.results-heading {
  display: flex;
  justify-content: space-between;
  padding: 13px 18px;
  background: #fffafd;
  border-top: 1px solid #f7e2ec;
  border-bottom: 1px solid #f7e2ec;
  font-weight: bold;
}

#resultCount {
  color: var(--muted);
  font-size: 12px;
  font-weight: normal;
}

#resultList {
  flex: 1;
  overflow-y: auto;
  list-style: none;
  padding: 0;
  margin: 0;
}

.place-item {
  padding: 15px 18px;
  border-bottom: 1px solid #f6e7ee;
  cursor: pointer;
}

.place-item:hover { background: #fff4f8; }

.place-name {
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 7px;
}

.place-address {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.5;
}

.place-phone {
  color: #806a78;
  font-size: 12px;
  margin-top: 6px;
}

.place-link {
  display: inline-block;
  margin-top: 8px;
  color: var(--dark-pink);
  font-size: 12px;
  text-decoration: none;
}

.empty-state {
  padding: 30px 18px;
  text-align: center;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.7;
}

#map {
  flex: 1;
  min-width: 0;
  height: 100%;
  border: 1px solid var(--border);
  border-radius: 18px;
  overflow: hidden;
  background: #fff7fb;
}

@media (max-width: 700px) {
  .container {
    height: auto;
    min-height: 100vh;
    flex-direction: column;
    padding: 10px;
  }
  .sidebar {
    width: 100%;
    min-width: 0;
    height: 58vh;
  }
  #map {
    flex: none;
    width: 100%;
    height: 42vh;
    min-height: 300px;
  }
}
</style>
</head>

<body>
<div class="container">

  <aside class="sidebar">
    <div class="header">
      <h1>내 결혼 상대 결정하기 💗</h1>
      <p class="description">
        결혼정보회사와 재혼 전문 업체를 검색하고<br>
        지도에서 위치를 확인해 보세요.
      </p>
    </div>

    <div class="controls">
      <div class="tabs">
        <button type="button" class="tab active" id="generalTab">
          ♥ 결혼정보회사
        </button>
        <button type="button" class="tab" id="remarriageTab">
          ♥ 재혼 전문 업체
        </button>
      </div>

      <form id="searchForm">
        <input
          id="searchInput"
          type="text"
          placeholder="예: 강남구, 부산 해운대구"
          aria-label="지역 또는 업체 검색"
        >
        <button type="submit" id="searchButton">⌕ 검색</button>
      </form>

      <button type="button" id="locationButton">
        ♥ 현재 위치로 이동
      </button>
    </div>

    <p id="status" role="status" aria-live="polite">
      카카오맵을 불러오는 중입니다.
    </p>

    <div class="results-heading">
      <span>검색 결과</span>
      <span id="resultCount">총 0개</span>
    </div>

    <ul id="resultList">
      <li class="empty-state">
        지역이나 검색어를 입력한 후 검색해 보세요.
      </li>
    </ul>
  </aside>

  <main id="map" aria-label="결혼정보회사 지도"></main>
</div>

<script>
const KAKAO_APP_KEY = "f38811e47209589c76ef3002c7c95204";

let map;
let placesService;
let geocoder;
let infoWindow;
let markers = [];
let currentPosition = null;
let activeType = "general";
let searchSequence = 0;

const searchInput = document.getElementById("searchInput");
const searchForm = document.getElementById("searchForm");
const searchButton = document.getElementById("searchButton");
const locationButton = document.getElementById("locationButton");
const resultList = document.getElementById("resultList");
const resultCount = document.getElementById("resultCount");
const statusText = document.getElementById("status");
const generalTab = document.getElementById("generalTab");
const remarriageTab = document.getElementById("remarriageTab");

const keywords = {
  general: ["결혼정보회사", "결혼정보업체", "결혼정보사"],
  remarriage: ["재혼정보회사", "재혼전문", "재혼정보"]
};

function setStatus(message) {
  statusText.textContent = message;
}

function showSdkError() {
  setStatus(
    "카카오맵을 불러오지 못했습니다. JavaScript 키와 사이트 도메인 설정을 확인해 주세요."
  );
}

function loadKakaoSdk() {
  setStatus("카카오맵을 불러오는 중입니다.");

  const script = document.createElement("script");
  script.src =
    "https://dapi.kakao.com/v2/maps/sdk.js?appkey=" +
    encodeURIComponent(KAKAO_APP_KEY) +
    "&libraries=services&autoload=false";

  script.onload = function () {
    if (!window.kakao || !window.kakao.maps) {
      showSdkError();
      return;
    }

    kakao.maps.load(function () {
      initializeMap();
    });
  };

  script.onerror = showSdkError;
  document.head.appendChild(script);
}

function initializeMap() {
  const center = new kakao.maps.LatLng(37.5665, 126.9780);

  map = new kakao.maps.Map(
    document.getElementById("map"),
    {
      center: center,
      level: 6
    }
  );

  placesService = new kakao.maps.services.Places();
  geocoder = new kakao.maps.services.Geocoder();
  infoWindow = new kakao.maps.InfoWindow({ zIndex: 10 });

  setStatus("지역이나 업체명을 입력해 검색해 보세요.");
}

function showEmpty(message) {
  const item = document.createElement("li");
  item.className = "empty-state";
  item.textContent = message;
  resultList.replaceChildren(item);
}

function clearMarkers() {
  markers.forEach(function (marker) {
    marker.setMap(null);
  });

  markers = [];

  if (infoWindow) infoWindow.close();
}

function switchTab(type) {
  activeType = type;

  generalTab.classList.toggle("active", type === "general");
  remarriageTab.classList.toggle("active", type === "remarriage");

  searchInput.value = "";
  searchInput.placeholder = type === "general"
    ? "예: 강남구, 부산 해운대구, 결혼정보회사"
    : "예: 강남구 재혼, 부산 재혼정보회사";

  resultList.replaceChildren();
  resultCount.textContent = "총 0개";
  clearMarkers();

  setStatus(type === "general"
    ? "결혼정보회사 탭입니다."
    : "재혼 전문 업체 탭입니다.");

  showEmpty("검색어를 입력한 후 검색해 보세요.");
}

generalTab.addEventListener("click", function () {
  switchTab("general");
});

remarriageTab.addEventListener("click", function () {
  switchTab("remarriage");
});

locationButton.addEventListener("click", function () {
  if (!map) {
    setStatus("지도가 아직 준비되지 않았습니다.");
    return;
  }

  if (!navigator.geolocation) {
    setStatus("브라우저에서 현재 위치를 지원하지 않습니다.");
    return;
  }

  setStatus("현재 위치를 확인하고 있습니다.");

  navigator.geolocation.getCurrentPosition(
    function (position) {
      currentPosition = new kakao.maps.LatLng(
        position.coords.latitude,
        position.coords.longitude
      );

      map.setCenter(currentPosition);
      map.setLevel(5);
      setStatus("현재 위치로 이동했습니다.");
    },
    function () {
      setStatus("위치 권한을 확인해 주세요. 지역을 직접 검색할 수도 있습니다.");
    },
    {
      enableHighAccuracy: false,
      timeout: 10000,
      maximumAge: 60000
    }
  );
});

searchForm.addEventListener("submit", function (event) {
  event.preventDefault();
  searchPlaces();
});

function searchPlaces() {
  if (!map || !placesService) {
    setStatus("지도가 아직 준비되지 않았습니다. 잠시 후 다시 시도해 주세요.");
    return;
  }

  const query = searchInput.value.trim();

  if (!query) {
    setStatus("지역이나 검색어를 입력해 주세요.");
    searchInput.focus();
    return;
  }

  const sequence = ++searchSequence;
  const collected = new Map();
  const isCompanyQuery =
    /결혼정보|결혼정보회사|결혼정보업체|결혼정보사|재혼/.test(query);

  let terms = [];

  if (activeType === "general") {
    if (isCompanyQuery) {
      terms = [query];
    } else {
      terms = keywords.general.map(function (word) {
        return query + " " + word;
      });
    }
  } else {
    if (/재혼/.test(query)) {
      terms = [query];
      if (!/재혼정보회사/.test(query)) {
        terms.push(query + " 재혼정보회사");
      }
    } else {
      terms = keywords.remarriage.map(function (word) {
        return query + " " + word;
      });
    }
  }

  terms = [...new Set(terms)];

  searchButton.disabled = true;
  resultList.replaceChildren();
  resultCount.textContent = "검색 중…";
  clearMarkers();
  setStatus("업체를 검색하고 있습니다.");

  const tasks = [];

  terms.forEach(function (term) {
    [1, 2].forEach(function (page) {
      tasks.push({ term: term, page: page });
    });
  });

  let finished = 0;

  tasks.forEach(function (task) {
    const options = { page: task.page, size: 15 };

    if (currentPosition && !isCompanyQuery) {
      options.location = currentPosition;
      options.radius = 20000;
    }

    placesService.keywordSearch(
      task.term,
      function (data, status) {
        if (sequence !== searchSequence) return;

        if (status === kakao.maps.services.Status.OK) {
          data.forEach(function (place) {
            if (activeType === "remarriage") {
              const text = [
                place.place_name || "",
                place.category_name || "",
                place.address_name || "",
                place.road_address_name || ""
              ].join(" ");

              // 재혼 관련 표현이 있는 결과만 표시
              if (!/재혼/.test(text)) return;
            }

            const key = place.id ||
              (place.place_name + "|" + place.x + "|" + place.y);

            if (!collected.has(key)) {
              collected.set(key, place);
            }
          });
        }

        finished++;

        if (finished === tasks.length) {
          finishSearch();
        }
      },
      options
    );
  });

  function finishSearch() {
    if (sequence !== searchSequence) return;

    searchButton.disabled = false;
    const results = Array.from(collected.values());

    resultCount.textContent = "총 " + results.length + "개";

    if (!results.length) {
      setStatus(activeType === "remarriage"
        ? "재혼 관련 검색 결과가 없습니다. 다른 지역이나 검색어를 입력해 보세요."
        : "검색 결과가 없습니다. 다른 검색어를 입력해 보세요.");

      showEmpty("검색 결과가 없습니다.");
      return;
    }

    displayResults(results);
    setStatus("검색 결과 " + results.length + "개를 표시합니다.");
  }
}

function displayResults(places) {
  const bounds = new kakao.maps.LatLngBounds();

  resultList.replaceChildren();
  clearMarkers();

  places.forEach(function (place, index) {
    const position = new kakao.maps.LatLng(
      Number(place.y),
      Number(place.x)
    );

    bounds.extend(position);

    const marker = new kakao.maps.Marker({
      map: map,
      position: position
    });

    markers.push(marker);

    kakao.maps.event.addListener(marker, "click", function () {
      showPlaceInfo(place, marker);
    });

    const item = document.createElement("li");
    item.className = "place-item";

    const name = document.createElement("div");
    name.className = "place-name";
    name.textContent = (index + 1) + ". " + place.place_name;

    const address = document.createElement("div");
    address.className = "place-address";
    address.textContent =
      place.road_address_name ||
      place.address_name ||
      "주소 정보 없음";

    item.append(name, address);

    if (place.phone) {
      const phone = document.createElement("div");
      phone.className = "place-phone";
      phone.textContent = place.phone;
      item.appendChild(phone);
    }

    if (place.place_url) {
      const link = document.createElement("a");
      link.className = "place-link";
      link.href = place.place_url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = "카카오맵에서 보기";
      item.appendChild(link);
    }

    item.addEventListener("click", function (event) {
      if (event.target.closest("a")) return;

      map.panTo(position);
      showPlaceInfo(place, marker);
    });

    resultList.appendChild(item);
  });

  if (places.length) map.setBounds(bounds);
}

function showPlaceInfo(place, marker) {
  const content = document.createElement("div");
  content.style.cssText =
    "padding:10px;max-width:230px;font-size:13px;";

  const name = document.createElement("strong");
  name.textContent = place.place_name;

  const address = document.createElement("div");
  address.style.marginTop = "6px";
  address.textContent =
    place.road_address_name ||
    place.address_name ||
    "주소 정보 없음";

  content.append(name, address);

  infoWindow.close();
  infoWindow.setContent(content);
  infoWindow.open(map, marker);
}

loadKakaoSdk();
</script>
</body>
</html>
